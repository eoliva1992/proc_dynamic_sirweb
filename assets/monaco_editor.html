<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monaco Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
    #container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    // ── Configuración de require para Monaco (CDN) ─────────────────────────
    var require = {
      paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script>
    // ── Estado global ─────────────────────────────────────────────────────────
    var _editor = null;
    var _language = 'sql';
    var _theme = 'vs-dark';
    var _pendingCode = null;
    var _pendingLang = null;
    var _pendingTheme = null;
    var _ignoreNextChange = false;
    var _markers = [];

    // ── Inicialización de Monaco ──────────────────────────────────────────────
    require(['vs/editor/editor.main'], function () {

      // Registrar lenguaje 'plsql' basado en sql con keywords Oracle adicionales
      monaco.languages.register({ id: 'plsql' });
      monaco.languages.setMonarchTokensProvider('plsql', {
        ignoreCase: true,
        keywords: [
          'SELECT','FROM','WHERE','INSERT','UPDATE','DELETE','CREATE','ALTER',
          'DROP','TABLE','VIEW','INDEX','PROCEDURE','FUNCTION','PACKAGE','BODY',
          'BEGIN','END','IF','THEN','ELSE','ELSIF','LOOP','FOR','WHILE','EXIT',
          'WHEN','CASE','RETURN','DECLARE','EXCEPTION','RAISE','IS','AS','IN',
          'OUT','NULL','TRUE','FALSE','AND','OR','NOT','LIKE','BETWEEN','IN',
          'EXISTS','HAVING','GROUP','ORDER','BY','DISTINCT','ALL','UNION',
          'INTERSECT','MINUS','JOIN','INNER','OUTER','LEFT','RIGHT','FULL',
          'CROSS','ON','USING','COMMIT','ROLLBACK','SAVEPOINT','EXECUTE','INTO',
          'VALUES','SET','TYPE','CURSOR','OPEN','FETCH','CLOSE','RECORD',
          'VARCHAR2','NUMBER','DATE','BOOLEAN','INTEGER','PLS_INTEGER','CHAR',
          'CLOB','BLOB','ROWTYPE','ROWID','DBMS_OUTPUT','PUT_LINE','FORALL',
          'BULK','COLLECT','LIMIT','PIPE','ROW','PIPELINED','DETERMINISTIC',
          'PRAGMA','AUTONOMOUS_TRANSACTION','EXCEPTION_INIT',
        ],
        tokenizer: {
          root: [
            [/--.*$/, 'comment'],
            [/\/\*/, 'comment', '@comment'],
            [/'[^']*'/, 'string'],
            [/\d+(\.\d+)?/, 'number'],
            [/[a-zA-Z_]\w*/, {
              cases: { '@keywords': 'keyword', '@default': 'identifier' }
            }],
            [/[;,().]/, 'delimiter'],
            [/[<>=!&|+\-*\/]/, 'operator'],
          ],
          comment: [
            [/[^/*]+/, 'comment'],
            [/\*\//, 'comment', '@pop'],
            [/[/*]/, 'comment'],
          ],
        },
      });

      // Completions básicas PL/SQL + dinámicas desde Dart
      // ─────────────────────────────────────────────────────────────────────

      // Schema recibido desde Dart (se actualiza via monacoReceiveMessage)
      var _schema = {
        tables: [],
        views: [],
        objects: [],    // [{name, type}]
        columns: {},    // { 'TABLA': [{name, type}] }
        packages: {},   // { 'PKG': [{name, kind, args:[{name,type,inOut}]}] }
        types: {},      // { 'TYPE': [{name, type}] }
        objectArgs: {}, // { 'PROC': [{name, type, inOut}] }
        loaded: false,  // false hasta que Dart envíe setCompletionSchema
      };

      // Tipo Oracle del objeto (PACKAGE, TYPE, PROCEDURE, FUNCTION) o null
      function objectTypeOf(name) {
        for (var i = 0; i < _schema.objects.length; i++) {
          if (_schema.objects[i].name === name) return _schema.objects[i].type;
        }
        return null;
      }

      // Snippet de llamada con notación nombrada: F(P1 => ${1:P1}, ...)
      // Sólo los procedimientos terminan en ';'; funciones y constructores de
      // types se usan como expresión.
      function buildCallSnippet(name, kind, args) {
        var isProc = String(kind || '').toUpperCase() === 'PROCEDURE';
        if (!args || args.length === 0) {
          return { text: isProc ? name + ';' : name + '()', snippet: false };
        }
        var parts = args.map(function(a, i) {
          return a.name + ' => ${' + (i + 1) + ':' + a.name + '}';
        });
        var body = name + '(' + parts.join(', ') + ')';
        return { text: isProc ? body + ';' : body, snippet: true };
      }

      // Firma cacheada de un objeto según su tipo (null si aún no llegó)
      function signatureOf(name, type) {
        if (type === 'PROCEDURE' || type === 'FUNCTION') {
          return _schema.objectArgs[name] || null;
        }
        if (type === 'TYPE') return _schema.types[name] || null;
        return null;
      }

      // Argumentos de un subprograma: suelto, miembro de un package o type
      function argsOf(owner, member) {
        if (member) {
          var subs = _schema.packages[owner];
          if (!subs) return null;
          for (var i = 0; i < subs.length; i++) {
            if (subs[i].name === member) return subs[i].args || [];
          }
          return [];
        }
        return _schema.objectArgs[owner] || _schema.types[owner] || null;
      }

      // Extrae las tablas del bloque FROM/JOIN del texto antes del cursor
      function extractFromTables(textBefore) {
        var result = {};
        // FROM ... hasta WHERE/GROUP/ORDER/HAVING o fin
        var fromMatch = textBefore.match(/FROM\s+([\s\S]*?)(?:WHERE|GROUP\s+BY|ORDER\s+BY|HAVING|$)/i);
        var fromBlock = fromMatch ? fromMatch[1] : '';

        // Cada "tabla [AS] alias" separado por coma
        var tableRe = /(\w+)(?:\s+AS\s+|\s+)(\w+)?/gi;
        var m;
        while ((m = tableRe.exec(fromBlock)) !== null) {
          var tbl = m[1].toUpperCase();
          var alias = m[2] ? m[2].toUpperCase() : null;
          result[tbl] = tbl;
          if (alias && alias !== tbl) result[alias] = tbl;
        }

        // JOINs
        var joinRe = /JOIN\s+(\w+)(?:\s+AS\s+|\s+)(\w+)?/gi;
        while ((m = joinRe.exec(textBefore)) !== null) {
          var tbl = m[1].toUpperCase();
          var alias = m[2] ? m[2].toUpperCase() : null;
          result[tbl] = tbl;
          if (alias) result[alias] = tbl;
        }

        return result;
      }

      monaco.languages.registerCompletionItemProvider('plsql', {
        // Disparar también al escribir punto
        triggerCharacters: ['.'],

        provideCompletionItems: function(model, position) {
          var textBefore = model.getValueInRange({
            startLineNumber: 1, startColumn: 1,
            endLineNumber: position.lineNumber, endColumn: position.column,
          });

          var word = model.getWordUntilPosition(position);
          var range = {
            startLineNumber: position.lineNumber,
            endLineNumber: position.lineNumber,
            startColumn: word.startColumn,
            endColumn: word.endColumn,
          };

          var suggestions = [];

          // ── Caso 1: "PKG." → subprogramas · "ALIAS." → columnas ───────────
          var dotMatch = textBefore.match(/([A-Za-z]\w*)\.(\w*)$/);
          if (dotMatch) {
            var tableRef = dotMatch[1].toUpperCase();
            var memberPrefix = dotMatch[2].toUpperCase();

            // Ajustar range para reemplazar sólo lo escrito tras el punto
            var dotRange = {
              startLineNumber: position.lineNumber,
              endLineNumber: position.lineNumber,
              startColumn: position.column - memberPrefix.length,
              endColumn: position.column,
            };

            // 1.a) Package → procedimientos y funciones que expone
            var refType = objectTypeOf(tableRef);
            if (refType === 'PACKAGE') {
              var subs = _schema.packages[tableRef];
              if (!subs) {
                return {
                  suggestions: [{
                    label: '⏳ Cargando miembros de ' + tableRef + '...',
                    kind: monaco.languages.CompletionItemKind.Text,
                    insertText: '',
                    range: dotRange,
                    sortText: 'z',
                  }],
                  incomplete: true,
                };
              }
              subs.forEach(function(s) {
                if (memberPrefix && s.name.indexOf(memberPrefix) !== 0) return;
                var args = s.args || [];
                var call = buildCallSnippet(s.name, s.kind, args);
                suggestions.push({
                  label: s.name,
                  kind: s.kind === 'FUNCTION'
                    ? monaco.languages.CompletionItemKind.Function
                    : monaco.languages.CompletionItemKind.Method,
                  detail: args.length === 0
                    ? s.kind + ' · ' + tableRef
                    : s.kind + ' (' + args.map(function(a) { return a.name; }).join(', ') + ')',
                  documentation: args.length === 0 ? undefined : args
                    .map(function(a) { return (a.name + ' ' + (a.inOut || '') + ' ' + (a.type || '')).trim(); })
                    .join('\n'),
                  insertText: call.text,
                  insertTextRules: call.snippet
                    ? monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
                    : undefined,
                  range: dotRange,
                  sortText: '0' + s.name,
                });
              });
              return { suggestions: suggestions, incomplete: false };
            }

            // 1.b) Type objeto → sus atributos
            if (refType === 'TYPE') {
              var attrs = _schema.types[tableRef];
              if (!attrs) {
                return {
                  suggestions: [{
                    label: '⏳ Cargando atributos de ' + tableRef + '...',
                    kind: monaco.languages.CompletionItemKind.Text,
                    insertText: '',
                    range: dotRange,
                    sortText: 'z',
                  }],
                  incomplete: true,
                };
              }
              attrs.forEach(function(a) {
                if (memberPrefix && a.name.indexOf(memberPrefix) !== 0) return;
                suggestions.push({
                  label: a.name,
                  kind: monaco.languages.CompletionItemKind.Field,
                  detail: a.type + ' · ' + tableRef,
                  insertText: a.name,
                  range: dotRange,
                  sortText: '0' + a.name,
                });
              });
              return { suggestions: suggestions, incomplete: false };
            }

            // 1.c) Tabla o alias → columnas
            var fromMap = extractFromTables(textBefore);
            var realTable = fromMap[tableRef] || tableRef;
            var cols = _schema.columns[realTable] || [];

            cols.forEach(function(col) {
              if (memberPrefix && col.name.indexOf(memberPrefix) !== 0) return;
              suggestions.push({
                label: col.name,
                kind: monaco.languages.CompletionItemKind.Field,
                detail: col.type + ' · ' + realTable,
                insertText: col.name,
                range: dotRange,
                sortText: '0' + col.name, // columnas primero
              });
            });

            // Si no hay columnas cargadas aún, ofrecer placeholder
            if (cols.length === 0) {
              suggestions.push({
                label: '⏳ Cargando columnas de ' + realTable + '...',
                kind: monaco.languages.CompletionItemKind.Text,
                insertText: '',
                range: dotRange,
                sortText: 'z',
              });
            }

            return { suggestions: suggestions, incomplete: !_schema.loaded };
          }

          // ── Caso 1.d: dentro de "MI_PROC(" → parámetros nombrados ──────────
          var callMatch = textBefore.match(/([A-Za-z]\w*)(?:\.([A-Za-z]\w*))?\s*\(([^()]*)$/);
          if (callMatch) {
            var owner = callMatch[1].toUpperCase();
            var member = callMatch[2] ? callMatch[2].toUpperCase() : null;
            var written = (callMatch[3] || '').toUpperCase();
            var ownerType = objectTypeOf(owner);
            var valid = member
              ? ownerType === 'PACKAGE'
              : (ownerType === 'PROCEDURE' || ownerType === 'FUNCTION' ||
                 ownerType === 'TYPE');
            if (valid) {
              var callArgs = argsOf(owner, member);
              if (callArgs) {
                var argPrefix = word.word.toUpperCase();
                callArgs.forEach(function(a) {
                  if (argPrefix && a.name.indexOf(argPrefix) !== 0) return;
                  if (new RegExp('\\b' + a.name + '\\s*=>').test(written)) return;
                  suggestions.push({
                    label: a.name,
                    kind: monaco.languages.CompletionItemKind.Property,
                    detail: ((a.inOut || '') + ' ' + (a.type || '')).trim(),
                    insertText: a.name + ' => ',
                    range: range,
                    sortText: '0' + a.name,
                  });
                });
                if (suggestions.length > 0) {
                  return { suggestions: suggestions, incomplete: false };
                }
              }
            }
          }

          // ── Caso 2: palabra suelta ─────────────────────────────────────────
          var prefix = word.word.toUpperCase();
          var fromTables = extractFromTables(textBefore);

          // Columnas de tablas en el FROM (sin punto)
          Object.values(fromTables).forEach(function(realTable) {
            var cols = _schema.columns[realTable] || [];
            cols.forEach(function(col) {
              if (!prefix || col.name.startsWith(prefix)) {
                suggestions.push({
                  label: col.name,
                  kind: monaco.languages.CompletionItemKind.Field,
                  detail: col.type + ' · ' + realTable,
                  insertText: col.name,
                  range: range,
                  sortText: '1' + col.name,
                });
              }
            });
          });

          // Tablas
          _schema.tables.forEach(function(t) {
            if (!prefix || t.startsWith(prefix)) {
              suggestions.push({
                label: t,
                kind: monaco.languages.CompletionItemKind.Class,
                detail: 'TABLE',
                insertText: t,
                range: range,
                sortText: '2' + t,
              });
            }
          });

          // Vistas
          _schema.views.forEach(function(v) {
            if (!prefix || v.startsWith(prefix)) {
              suggestions.push({
                label: v,
                kind: monaco.languages.CompletionItemKind.Interface,
                detail: 'VIEW',
                insertText: v,
                range: range,
                sortText: '3' + v,
              });
            }
          });

          // Objetos (procedimientos, funciones, packages, types)
          _schema.objects.forEach(function(o) {
            if (!prefix || o.name.startsWith(prefix)) {
              var itemKind = o.type === 'FUNCTION'
                ? monaco.languages.CompletionItemKind.Function
                : o.type === 'PACKAGE'
                  ? monaco.languages.CompletionItemKind.Module
                  : o.type === 'TYPE'
                    ? monaco.languages.CompletionItemKind.Class
                    : monaco.languages.CompletionItemKind.Method;
              var sig = signatureOf(o.name, o.type);
              var call = sig ? buildCallSnippet(o.name, o.type, sig) : null;
              suggestions.push({
                label: o.name,
                kind: itemKind,
                detail: sig && sig.length > 0
                  ? o.type + ' (' + sig.map(function(a) { return a.name; }).join(', ') + ')'
                  : o.type,
                insertText: call ? call.text : o.name,
                insertTextRules: (call && call.snippet)
                  ? monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
                  : undefined,
                range: range,
                sortText: '4' + o.name,
              });
            }
          });

          // Snippets básicos PL/SQL
          var snippets = [
            { label: 'BEGIN...END', insertText: 'BEGIN\n\t${1:NULL};\nEND;',
              detail: 'Bloque BEGIN/END' },
            { label: 'IF...THEN...END IF',
              insertText: 'IF ${1:condicion} THEN\n\t${2:NULL};\nEND IF;',
              detail: 'Condicional IF' },
            { label: 'FOR...LOOP',
              insertText: 'FOR ${1:i} IN ${2:1}..${3:10} LOOP\n\t${4:NULL};\nEND LOOP;',
              detail: 'Bucle FOR' },
            { label: 'WHILE...LOOP',
              insertText: 'WHILE ${1:condicion} LOOP\n\t${2:NULL};\nEND LOOP;',
              detail: 'Bucle WHILE' },
            { label: 'EXCEPTION',
              insertText: 'EXCEPTION\n\tWHEN ${1:OTHERS} THEN\n\t\t${2:NULL};',
              detail: 'Bloque EXCEPTION' },
            { label: 'DBMS_OUTPUT.PUT_LINE',
              insertText: "DBMS_OUTPUT.PUT_LINE('${1:mensaje}');",
              detail: 'Print de debug' },
            { label: 'CURSOR',
              insertText: 'CURSOR ${1:cur} IS\n\tSELECT ${2:*} FROM ${3:tabla};',
              detail: 'Declaración de cursor' },
          ];

          snippets.forEach(function(s) {
            if (!prefix || s.label.toUpperCase().startsWith(prefix)) {
              suggestions.push({
                label: s.label,
                kind: monaco.languages.CompletionItemKind.Snippet,
                insertText: s.insertText,
                insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                documentation: s.detail,
                detail: s.detail,
                range: range,
                sortText: '5' + s.label,
              });
            }
          });

          return { suggestions: suggestions, incomplete: !_schema.loaded };
        }
      });

      // Función para recibir mensajes desde Dart con datos del schema
      function monacoReceiveMessage(msg) {
        if (msg.action === 'setCompletionSchema') {
          _schema.tables = msg.tables || [];
          _schema.views = msg.views || [];
          _schema.objects = msg.objects || [];
          _schema.loaded = true;
        } else if (msg.action === 'setTableColumns') {
          _schema.columns[msg.table] = msg.columns || [];
        } else if (msg.action === 'setPackageSubprograms') {
          _schema.packages[msg.package] = msg.subprograms || [];
        } else if (msg.action === 'setTypeAttributes') {
          _schema.types[msg.type] = msg.attributes || [];
        } else if (msg.action === 'setObjectArguments') {
          _schema.objectArgs[msg.object] = msg.args || [];
        }
      }

      // Crear el editor
      _editor = monaco.editor.create(document.getElementById('container'), {
        value: _pendingCode || '',
        language: _pendingLang || _language,
        theme: _pendingTheme || _theme,
        automaticLayout: true,
        fontSize: 14,
        fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace",
        fontLigatures: true,
        minimap: { enabled: true },
        scrollBeyondLastLine: false,
        wordWrap: 'off',
        lineNumbers: 'on',
        renderWhitespace: 'none',
        tabSize: 2,
        insertSpaces: true,
        rulers: [],
        bracketPairColorization: { enabled: true },
        formatOnPaste: false,
        contextmenu: true,
        // Fuerza a que el menú contextual, el widget de sugerencias y el hover
        // se rendericen DENTRO del contenedor del editor en vez de anclados a
        // document.body con position:fixed. Sin esto, en el WebView2 embebido
        // como Texture de Flutter, esos widgets se ven en la posición correcta
        // pero los clics no llegan a registrarse (el mapeo de coordenadas del
        // puntero no coincide con el layout fixed de página completa), aunque
        // la navegación por teclado (flechas + Enter) sí funciona porque no
        // depende de coordenadas.
        fixedOverflowWidgets: true,
        quickSuggestions: { other: true, comments: false, strings: false },
        suggestOnTriggerCharacters: true,
        acceptSuggestionOnEnter: 'off',   // Tab acepta, Enter NO
        tabCompletion: 'on',               // Tab acepta sugerencias
        snippetSuggestions: 'top',
        scrollbar: {
          vertical: 'auto',
          horizontal: 'auto',
          verticalScrollbarSize: 10,
          horizontalScrollbarSize: 10,
        },
      });

      // Notificar a Dart cuando el contenido cambia
      _editor.onDidChangeModelContent(function () {
        if (_ignoreNextChange) { _ignoreNextChange = false; return; }
        var code = _editor.getValue();
        // Llamada al canal de mensajes de webview_windows
        window.chrome.webview.postMessage(JSON.stringify({
          type: 'contentChanged',
          value: code,
        }));
      });

      // Notificar posición del cursor
      _editor.onDidChangeCursorPosition(function (e) {
        window.chrome.webview.postMessage(JSON.stringify({
          type: 'cursorChanged',
          line: e.position.lineNumber,
          col: e.position.column,
        }));
      });

      // Notificar que Monaco está listo
      window.chrome.webview.postMessage(JSON.stringify({ type: 'ready' }));
    });

    // ── API para Dart → Monaco ────────────────────────────────────────────────
    // Llamadas via webview.executeScript(...)

    function monacoSetValue(code) {
      if (!_editor) { _pendingCode = code; return; }
      _ignoreNextChange = true;
      _editor.setValue(code);
    }

    function monacoSetLanguage(lang) {
      _language = lang;
      if (!_editor) { _pendingLang = lang; return; }
      monaco.editor.setModelLanguage(_editor.getModel(), lang);
    }

    function monacoSetTheme(theme) {
      _theme = theme;
      if (!_editor) { _pendingTheme = theme; return; }
      monaco.editor.setTheme(theme);
    }

    function monacoSetFontSize(size) {
      if (!_editor) return;
      _editor.updateOptions({ fontSize: size });
    }

    function monacoSetReadOnly(readonly) {
      if (!_editor) return;
      _editor.updateOptions({ readOnly: readonly });
    }

    function monacoFocus() {
      if (!_editor) return;
      _editor.focus();
    }

    // Recibe errores desde Dart y los muestra como squiggles
    // errors = [{line, col, endLine, endCol, message, severity}]
    // severity: 8=Error, 4=Warning, 2=Info, 1=Hint
    function monacoSetMarkers(errorsJson) {
      if (!_editor) return;
      var errors = JSON.parse(errorsJson);
      var markers = errors.map(function(e) {
        return {
          startLineNumber: e.line,
          startColumn:     e.col || 1,
          endLineNumber:   e.endLine || e.line,
          endColumn:       e.endCol  || (e.col || 1) + 1,
          message:         e.message,
          severity:        e.severity || monaco.MarkerSeverity.Error,
        };
      });
      monaco.editor.setModelMarkers(_editor.getModel(), 'dart-checker', markers);
    }

    // Scroll a una línea específica
    function monacoRevealLine(line) {
      if (!_editor) return;
      _editor.revealLineInCenter(line);
    }

    // Formato del documento
    function monacoFormat() {
      if (!_editor) return;
      _editor.getAction('editor.action.formatDocument').run();
    }

    // Recibir mensajes de Dart hacia Monaco
    window.chrome.webview.addEventListener('message', function(event) {
      try {
        var msg = JSON.parse(event.data);
        switch(msg.action) {
          case 'setValue':            monacoSetValue(msg.value); break;
          case 'setLanguage':         monacoSetLanguage(msg.language); break;
          case 'setTheme':            monacoSetTheme(msg.theme); break;
          case 'setFontSize':         monacoSetFontSize(msg.size); break;
          case 'setReadOnly':         monacoSetReadOnly(msg.value); break;
          case 'setMarkers':          monacoSetMarkers(msg.errors); break;
          case 'revealLine':          monacoRevealLine(msg.line); break;
          case 'focus':               monacoFocus(); break;
          case 'format':              monacoFormat(); break;
          case 'setCompletionSchema': monacoReceiveMessage(msg); break;
          case 'setTableColumns':     monacoReceiveMessage(msg); break;
          case 'setPackageSubprograms': monacoReceiveMessage(msg); break;
          case 'setTypeAttributes':   monacoReceiveMessage(msg); break;
          case 'setObjectArguments':  monacoReceiveMessage(msg); break;
        }
      } catch(e) { /* ignorar mensajes malformados */ }
    });
  </script>
</body>
</html>
