name: proc_dynamic_sirweb
description: "Gestionar procesos de sirweb"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.1
  mobx: ^2.3.0
  flutter_mobx: ^2.2.0
  flutter_js: 0.8.7
  flutter_monaco: 3.4.3
  webview_flutter_windows: ^1.1.1
  shared_preferences: ^2.3.0
  toastification: ^3.2.0
  file_picker: ^11.0.3
  window_manager: ^0.5.2
  desktop_multi_window: ^0.3.1
  diff_match_patch: ^0.4.1
  signalr_netcore: ^1.4.4
  two_dimensional_scrollables: ^0.5.4
  appflowy_editor: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  mobx_codegen: ^2.6.0

dependency_overrides:
  # appflowy_editor 6.2.0 (pub.dev) no compila contra el SDK Flutter actual:
  #  - TextInputClient ganó el miembro abstracto `onFocusReceived` después de
  #    que se publicó esa versión.
  #  - Usa `FilePicker.platform.*`, API retirada en file_picker 11+ (el resto
  #    de la app ya usa `FilePicker.pickFiles()` estático).
  # Se vendorizó una copia parcheada en vendor/appflowy_editor-6.2.0 (2
  # cambios mínimos, ver ese directorio). Si se sube de versión el paquete
  # real, probar si ya trae el fix y volver a la fuente de pub.dev.
  appflowy_editor:
    path: vendor/appflowy_editor-6.2.0
  # appflowy_editor declara file_picker ^10.2.0; forzamos la versión que ya usa
  # el resto de la app (ver /memories/repo si esto deja de compilar al subir
  # de versión alguno de los dos paquetes).
  file_picker: ^11.0.3

flutter:
  uses-material-design: true
  assets:
    # Bundle ANTLR4 PL/SQL — generar con: cd tools/plsql_parser && ./build.ps1
    - assets/plsql_checker.js
